[package]
name = "basquete-app-ffi"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "basquete_app_ffi"

[features]
experimental-brazil-fixtures = ["basquete-app-core/experimental-brazil-fixtures"]

[dependencies]
basquete-app-core = { path = "../basquete-app-core" }
uniffi = { version = "0.32", features = ["cli"] }
